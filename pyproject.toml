[project]
name = "cufirst-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "email-validator>=2.3.0",
    "litestar>=2.24.0",
    "pydantic-settings>=2.15.0",
    "psycopg[binary]>=3.2.13",
    "pyjwt>=2.14.0",
    "sqlalchemy>=2.0.54",
    "uvicorn>=0.53.0",
    "pytimeparse>=1.1.8",
]

[project.scripts]
dev = "app.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
preview = true
select = ["E", "F", "I", "PLR1702", "UP"]

[tool.ruff.lint.pylint]
max-nested-blocks = 2

[dependency-groups]
dev = [
    "ruff>=0.16.8",
]
